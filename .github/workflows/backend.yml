name: Backend — tests et déploiement

# Deux temps :
#   • sur toute branche et toute pull request → contrôle qualité
#   • sur main uniquement → déploiement Render, puis vérification que c'est
#     bien le commit poussé qui tourne
#
# Le déploiement passe par le Deploy Hook de Render et non par SSH : l'hôte est
# géré, il n'y a pas de serveur où se connecter. L'ancien job utilisait
# appleboy/ssh-action avec un secret DEPLOY_HOST de VPS, et échouait sur
# « error: missing server host » depuis le passage à Render.
#
# Pourquoi déclencher depuis la CI plutôt que de laisser l'auto-déploiement de
# Render faire : Render déploie dès le push, sans attendre les tests. Un commit
# cassé partait donc en production, et la CI le signalait après coup. En
# coupant Auto-Deploy côté Render et en appelant le hook ici, l'ordre est
# garanti — tests verts, puis déploiement.

# Ce fichier vivait à la racine du dossier de travail `jendal/`, hors des cinq
# dépôts — donc dans aucun : GitHub ne lit `.github/workflows/` qu'à la racine
# d'un dépôt, et cette CI n'a jamais démarré. Les filtres `paths: Backend/**`
# et le `working-directory: Backend` datent de cette organisation en
# monodépôt ; ici, le dépôt EST le backend.
on:
  push:
    branches: [main]
  pull_request:

env:
  # Adresse publique du service : aucun secret, elle figure déjà dans les
  # bundles des interfaces. En dur ici, elle reste lisible dans les logs de la
  # CI — ce qu'on veut quand on cherche pourquoi une vérification a échoué.
  URL_SANTE: https://saambiz-back-uj2z.onrender.com/health

jobs:
  qualite:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests
        run: npm test
        env:
          # Les secrets de test n'ont aucune valeur réelle : ils servent
          # uniquement à faire passer les contrôles de démarrage de
          # config/security.js, qui exige trois secrets distincts.
          NODE_ENV: test
          JWT_SECRET: ci_acces_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_REFRESH_SECRET: ci_refresh_bbbbbbbbbbbbbbbbbbbbbbbbbbbb
          JWT_RESET_SECRET: ci_reset_cccccccccccccccccccccccccccccc
          CORS_ORIGIN: http://localhost:5190

      - name: Vérifier que l'image se construit
        run: docker build -t saambiz-backend:ci .

  deploiement:
    name: Déploiement Render
    needs: qualite
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Déclencher le déploiement Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -e
          # Un secret absent donnait jusqu'ici une erreur illisible du côté de
          # l'outil appelé. On le dit explicitement, avec la marche à suivre.
          if [ -z "$HOOK" ]; then
            echo "::error::Le secret RENDER_DEPLOY_HOOK est absent. Render → service backend → Settings → Deploy Hook, puis GitHub → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "Appel du Deploy Hook…"
          # -f pour que curl échoue sur un statut HTTP d'erreur : sans lui, un
          # hook révoqué renvoie 401 et le job passerait au vert.
          reponse=$(curl -fsS -X POST "$HOOK")
          echo "Render a répondu : $reponse"

      - name: Attendre que le commit poussé soit en ligne
        run: |
          set -e
          cible="${{ github.sha }}"
          echo "Commit attendu : $cible"
          echo "Sonde          : $URL_SANTE"
          echo ""

          # Une construction d'image Docker sur Render prend plusieurs minutes :
          # 60 tentatives espacées de 15 s laissent 15 minutes.
          #
          # On compare le champ `commit` de /health au SHA poussé. Se contenter
          # du code 200 ne prouverait rien : pendant toute la construction,
          # c'est l'ancienne instance qui répond — et elle répond 200.
          for i in $(seq 1 60); do
            corps=$(curl -fsS --max-time 20 "$URL_SANTE" 2>/dev/null || true)
            vu=$(printf '%s' "$corps" | jq -r '.commit // empty' 2>/dev/null || true)

            if [ "$vu" = "$cible" ]; then
              echo ""
              echo "En ligne sur $cible (tentative $i)"
              echo "Réponse : $corps"
              exit 0
            fi

            echo "  tentative $i/60 — commit en ligne : ${vu:-(indisponible)}"
            sleep 15
          done

          echo ""
          echo "::error::Le commit $cible n'est jamais apparu sur $URL_SANTE après 15 minutes. Consultez les logs de build du service dans Render."
          exit 1
