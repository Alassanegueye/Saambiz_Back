# ============================================================
#  SaamBiz API — Configuration Nginx (VPS Ubuntu)
#  Remplacer : YOUR_DOMAIN par votre vrai domaine
#              ex: api.saambiz.com
#  Déposer dans : /etc/nginx/sites-available/saambiz-backend
#  Activer via  : ln -sf /etc/nginx/sites-available/saambiz-backend \
#                        /etc/nginx/sites-enabled/saambiz-backend
# ============================================================

# Upstream Node.js (facilite les changements de port)
#
# Le port doit correspondre à HOST_PORT du .env (voir docker-compose.prod.yml) :
# un VPS qui héberge déjà une autre API sur 3000 publie SaamBiz ailleurs, et
# c'est ici qu'il faut le dire — sinon Nginx proxifie vers l'autre application.
upstream saambiz_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Certbot ACME challenge (renouvellement automatique)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS principal ───────────────────────────────────────────────────
server {
    # `listen … http2` et non `http2 on;` : cette seconde forme, pourtant la
    # seule recommandée aujourd'hui, n'existe qu'à partir de Nginx 1.25.1 —
    # Ubuntu 22.04 et 24.04 livrent 1.24. `nginx -t` échouait sur « unknown
    # directive "http2" », et comme un seul fichier invalide empêche de
    # recharger TOUS les sites de la machine, ajouter cette API en cassait les
    # autres. L'ancienne forme fonctionne sur les deux versions ; sur 1.25+
    # elle produit un simple avertissement de dépréciation.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── Certificats Let's Encrypt (générés par Certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── TLS durci ─────────────────────────────────────────────────────────────
    # Fourni par l'`include` ci-dessus : options-ssl-nginx.conf définit déjà
    # ssl_protocols, ssl_prefer_server_ciphers, ssl_ciphers et les réglages de
    # session — le jeu recommandé par Mozilla, tenu à jour par Certbot.
    #
    # Ces directives figuraient ici en double. Nginx tolère un doublon de
    # valeurs (ssl_protocols : avertissement) mais refuse un doublon de
    # directive : `nginx -t` échouait sur « "ssl_prefer_server_ciphers"
    # directive is duplicate », avec le même effet de blocage que ci-dessus.

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Headers sécurité ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # ── Taille max des uploads (Multer 5 MB + marge) ─────────────────────────
    client_max_body_size  10M;
    client_body_timeout   30s;
    client_header_timeout 10s;
    send_timeout          30s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   4;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml;

    # ── Health check direct (pas de log) ─────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass         http://saambiz_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
    }

    # ── Socket.IO (messagerie / notifications temps réel) ────────────────────
    # Le chemin par défaut de Socket.IO est /socket.io/ — bloc dédié pour un
    # timeout plus long adapté aux connexions persistantes.
    location /socket.io/ {
        proxy_pass         http://saambiz_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connexions WebSocket longue durée
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_buffering off;
    }

    # ── Proxy vers l'API Node.js ──────────────────────────────────────────────
    location / {
        proxy_pass         http://saambiz_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headers transmis à Express (nécessaires pour trust proxy + IP réelle)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Désactiver le buffering pour les réponses longues
        proxy_buffering    off;
        proxy_buffer_size  4k;
    }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/saambiz-backend-access.log combined;
    error_log  /var/log/nginx/saambiz-backend-error.log warn;
}

# ── Map nécessaire pour WebSocket upgrade ─────────────────────────────────────
# (À placer dans /etc/nginx/nginx.conf → section http{} ou dans un fichier conf.d/,
#  voir deploy/nginx-websocket-map.conf, copié automatiquement par setup-server.sh)
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
